<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="../auth.js"></script>
  <script>
    // Theme before first paint (no dark flash on a light page): the saved
    // choice from the chip toggle, else the system setting. See app.js.
    (function () {
      var t = null;
      try { t = localStorage.getItem("fop-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fairbank | Order Placement (details)</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="vendor/flatpickr.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/flatpickr.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!--
    Keyboard-first order entry. Open with ?e_customer_id=<Eclipse customer id>
    (the HubSpot customer card link), or without it to search for a customer.
    All behaviour lives in app.js. This copy (details.html) uses the details
    layout: no stock box, and a Details button on each line opens a dialog
    with that line's stock, qty breaks and comment.
  -->
  <main id="app" class="fop-app fop-app--details" data-layout="details">
    <noscript>
      <div class="fop-alert fop-alert--error">
        This tool requires JavaScript. Enable JavaScript and reload the page.
      </div>
    </noscript>
  </main>
</body>
</html>
